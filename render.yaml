# Render Blueprint — LERNEX backend on Render's FREE web service (no card).
# Render → New → Blueprint → pick this repo. Secrets marked `sync: false`
# are typed into the Render dashboard (never committed).
services:
  - type: web
    name: lernex-api
    runtime: node
    plan: free
    region: singapore # closest free region to India
    rootDir: backend
    # devDependencies are needed to compile (Nest CLI, TypeScript, Prisma CLI).
    buildCommand: npm install --include=dev --no-audit --no-fund && npx prisma generate && npm run build
    # Apply pending DB migrations + idempotent catalog seed, then start.
    startCommand: npx prisma migrate deploy && npx prisma db seed && node dist/main
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Neon → Connection string (with ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Cloudinary → Dashboard → "API environment variable" (cloudinary://…)
      - key: CLOUDINARY_URL
        sync: false
      # Owner/admin email(s), comma-separated
      - key: ADMIN_EMAILS
        sync: false
      # Random secrets generated by Render (never shared)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Add in the Environment tab (secrets, not committed):
      #   BREVO_API_KEY    — Brevo → SMTP & API → API Keys (free, 300 emails/day)
      #   MAIL_FROM_EMAIL  — the sender email you verified in Brevo
      #   MAIL_FROM_NAME   — e.g. LERNEX
      # Optional later (Environment tab): TURN_URL, TURN_USERNAME, TURN_CREDENTIAL
